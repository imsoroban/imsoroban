name: Update Profile Terminal SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-card.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate card.svg with live GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          from collections import Counter

          username = "imsoroban"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "profile-card-builder"
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          user = get_json(f"https://api.github.com/users/{username}")
          repos = get_json(f"https://api.github.com/users/{username}/repos?per_page=100&type=owner")

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos if not r.get("fork"))

          lang_counts = Counter()
          for r in repos:
              if not r.get("fork") and r.get("language"):
                  lang_counts[r["language"]] += 1

          top_langs = ", ".join(lang.lower() for lang, _ in lang_counts.most_common(4)) or "bash, html, css"

          svg = f'''<svg width="800" height="310" viewBox="0 0 800 310" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer Frame -->
            <rect width="800" height="310" rx="8" fill="#0d0d0d" stroke="#ff2a85" stroke-width="1.5"/>

            <!-- Terminal Title Bar -->
            <rect width="800" height="32" rx="8" fill="#141414"/>
            <rect y="24" width="800" height="8" fill="#141414"/>
            <line x1="0" y1="32" x2="800" y2="32" stroke="#262626" stroke-width="1"/>
            <circle cx="20" cy="16" r="5" fill="#ff2a85"/>
            <circle cx="38" cy="16" r="5" fill="#444444"/>
            <circle cx="56" cy="16" r="5" fill="#444444"/>
            <text x="400" y="20" text-anchor="middle" fill="#888888" font-family="monospace" font-size="12">soroban@linux-mint: ~/github</text>

            <!-- Left Column: Pixel Beetle Emblem & Identity -->
            <rect x="28" y="52" width="210" height="234" rx="6" fill="#080808" stroke="#262626" stroke-width="1"/>
            
            <!-- Pixel Art Beetle Icon -->
            <g transform="translate(97, 74) scale(4.5)">
              <!-- Antennae -->
              <rect x="4" y="1" width="1" height="2" fill="#ff2a85"/>
              <rect x="11" y="1" width="1" height="2" fill="#ff2a85"/>
              <rect x="5" y="3" width="1" height="1" fill="#ff2a85"/>
              <rect x="10" y="3" width="1" height="1" fill="#ff2a85"/>
              <!-- Head -->
              <rect x="6" y="4" width="4" height="2" fill="#ffffff"/>
              <!-- Legs -->
              <rect x="2" y="7" width="2" height="1" fill="#ff2a85"/>
              <rect x="12" y="7" width="2" height="1" fill="#ff2a85"/>
              <rect x="1" y="10" width="3" height="1" fill="#ff2a85"/>
              <rect x="12" y="10" width="3" height="1" fill="#ff2a85"/>
              <rect x="2" y="13" width="2" height="1" fill="#ff2a85"/>
              <rect x="12" y="13" width="2" height="1" fill="#ff2a85"/>
              <!-- Shell -->
              <rect x="5" y="6" width="6" height="8" fill="#ff2a85"/>
              <rect x="4" y="7" width="8" height="6" fill="#ff2a85"/>
              <!-- Wing Split & Spots -->
              <rect x="7.5" y="6" width="1" height="8" fill="#080808"/>
              <rect x="5.5" y="8.5" width="1.2" height="1.2" fill="#080808"/>
              <rect x="9.3" y="8.5" width="1.2" height="1.2" fill="#080808"/>
            </g>

            <text x="133" y="176" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">kaylyn</text>
            <text x="133" y="196" text-anchor="middle" fill="#ff2a85" font-family="monospace" font-size="13">@imsoroban</text>

            <rect x="52" y="216" width="162" height="22" rx="4" fill="#160910" stroke="#ff2a85" stroke-width="1"/>
            <text x="133" y="231" text-anchor="middle" fill="#ff2a85" font-family="monospace" font-size="11">tech enthusiast</text>

            <text x="133" y="266" text-anchor="middle" fill="#666666" font-family="monospace" font-size="11">retro tech • entomology</text>

            <!-- Right Column: Neofetch System & GitHub Telemetry -->
            <text x="264" y="74" fill="#ff2a85" font-family="monospace" font-size="14" font-weight="bold">$ neofetch --github</text>
            <line x1="264" y1="84" x2="770" y2="84" stroke="#262626" stroke-width="1"/>

            <text x="264" y="110" fill="#ff2a85" font-family="monospace" font-size="13">os</text>
            <text x="375" y="110" fill="#e0e0e0" font-family="monospace" font-size="13">Linux</text>

            <text x="264" y="134" fill="#ff2a85" font-family="monospace" font-size="13">shell</text>
            <text x="375" y="134" fill="#e0e0e0" font-family="monospace" font-size="13">bash / sh</text>

            <text x="264" y="158" fill="#ff2a85" font-family="monospace" font-size="13">known</text>
            <text x="375" y="158" fill="#e0e0e0" font-family="monospace" font-size="13">bash, html, css</text>

            <text x="264" y="182" fill="#ff2a85" font-family="monospace" font-size="13">learning</text>
            <text x="375" y="182" fill="#e0e0e0" font-family="monospace" font-size="13">python, c</text>

            <line x1="264" y1="198" x2="770" y2="198" stroke="#262626" stroke-width="1"/>

            <text x="264" y="222" fill="#ff2a85" font-family="monospace" font-size="13">repos</text>
            <text x="375" y="222" fill="#e0e0e0" font-family="monospace" font-size="13">{public_repos} public</text>

            <text x="264" y="246" fill="#ff2a85" font-family="monospace" font-size="13">telemetry</text>
            <text x="375" y="246" fill="#e0e0e0" font-family="monospace" font-size="13">{stars} stars  •  {followers} followers</text>

            <text x="264" y="270" fill="#ff2a85" font-family="monospace" font-size="13">top_langs</text>
            <text x="375" y="270" fill="#e0e0e0" font-family="monospace" font-size="13">{top_langs}</text>
          </svg>'''

          with open("card.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg
          git diff --staged --quiet || git commit -m "chore: update terminal profile card"
          git push